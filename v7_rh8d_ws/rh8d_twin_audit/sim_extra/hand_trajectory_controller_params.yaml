      \ max=\"1.5708\" min=\"0.0\" name=\"position\"/><state_interface name=\"position\"\
      /><state_interface name=\"effort\"/></joint><joint name=\"Thumb_Methacarpal--Thumb_axis\"\
      ><param name=\"mujoco_actuator\">pos_thumb_tendon</param><command_interface\
      \ max=\"1.5708\" min=\"0.0\" name=\"position\"/><state_interface name=\"position\"\
      /><state_interface name=\"effort\"/></joint><sensor name=\"palm_range\"><state_interface\
      \ name=\"value\"/></sensor><sensor name=\"thumb_tip_force\"><state_interface\
