      MujocoSystemHand\" type=\"system\"><hardware><plugin>mujoco_ros2_control/MujocoSystem</plugin></hardware><!--\
      \ \n      Mapping ros2_control joints to MuJoCo actuators\n\n      The RH8D\
      \ hand is tendon-driven in MuJoCo, so ROS 2 control joints\n      should not\
      \ be written directly as MuJoCo joints. Instead, their commands\n      must\
      \ be sent to MuJoCo position/tendon actuators.\n\n      The custom \"mujoco_actuator\"\
      \ parameter maps each ros2_control joint name\n      to the actual MuJoCo actuator\
      \ name.\n\n      Example:\n        ros2_control / URDF joint:\n          Index_Proximal__palm_assembly:1\n\
      \n        MuJoCo actuator:\n          pos_index_tendon\n\n      Only the proximal\
      \ joint is listed here as the ros2_control command handle.\n      The middle\
      \ and distal joints are not added as separate command interfaces\n      because\
      \ they are not independently actuated. They are mimicing the Proximal joint.\n\
      \n      This allows ROS 2 to keep URDF-compatible joint names for controllers,\n\
