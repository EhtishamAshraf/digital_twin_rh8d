      \ name=\"small_tip_force\"><state_interface name=\"x\"/><state_interface name=\"\
      y\"/><state_interface name=\"z\"/></sensor></ros2_control><ros2_control name=\"\
      MujocoSystemArm\" type=\"system\"><hardware><!-- By default, set up controllers\
      \ for simulation. This won't work on real hardware --><plugin>mujoco_ros2_control/MujocoSystem</plugin></hardware><!--\
      \ Add a parameter called \"mujoco_actuator\" to each joint, \n            which\
