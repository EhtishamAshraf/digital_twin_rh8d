      /><state_interface name=\"effort\"/></joint><joint name=\"palm_assembly:1--palm_axis:1\"\
      ><param name=\"mujoco_actuator\">pos_palm_assembly</param><command_interface\
      \ max=\"0.785398\" min=\"-0.785398\" name=\"position\"/><state_interface name=\"\
      position\"/><state_interface name=\"effort\"/></joint><joint name=\"Thumb_axis--palm_assembly:1\"\
